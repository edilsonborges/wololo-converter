name: Wololo
options:
  bundleIdPrefix: dev.edilson.wololo
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  WololoKit:
    path: Packages/WololoKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 5T3LZC3A68
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      DEAD_CODE_STRIPPING: YES
targets:
  Wololo:
    type: application
    platform: iOS
    sources:
      - WololoApp
      - Shared
      - Resources
    dependencies:
      - package: WololoKit
      - target: WololoShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.edilson.wololo
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(WOLOLO_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
  WololoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - WololoShareExtension
      - Shared
      - Resources
    dependencies:
      - package: WololoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.edilson.wololo.share
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(WOLOLO_SHARE_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  WololoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WololoAppTests
    dependencies:
      - target: Wololo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.edilson.wololo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wololo
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  WololoUITests:
    build:
      targets:
        Wololo: all
        WololoUITests: [test]
    test:
      targets: [WololoUITests]
  Wololo:
    build:
      targets:
        Wololo: all
    run:
      config: Debug
    archive:
      config: Release
