version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wololo-backend
    restart: unless-stopped
    environment:
      - DEBUG=false
      - TEMP_DIR=/tmp/wololo
      - DATABASE_URL=sqlite+aiosqlite:///./data/wololo.db
      - MAX_CONCURRENT_DOWNLOADS=3
      - MAX_QUEUED_DOWNLOADS=${MAX_QUEUED_DOWNLOADS:-20}
      - API_KEYS=${API_KEYS:-}
      - MIN_APP_VERSION=${MIN_APP_VERSION:-1.0.0}
      - RATE_LIMIT_DOWNLOADS=10/minute
      - COOKIES_FILE=/app/cookies.txt
    volumes:
      - backend_data:/app/data
      - temp_downloads:/tmp/wololo
      - ./cookies.txt:/app/cookies.txt
    ports:
      - "47652:47652"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:47652/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      # Repo root, so the build can bundle CHANGELOG.md (see .dockerignore)
      context: .
      dockerfile: frontend/Dockerfile
    container_name: wololo-frontend
    restart: unless-stopped
    ports:
      - "47651:47651"
    depends_on:
      - backend

volumes:
  backend_data:
    driver: local
  temp_downloads:
    driver: local
