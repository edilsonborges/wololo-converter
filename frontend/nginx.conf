server {
    listen 47651;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects: behind the public proxy the internal port is wrong
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Plain-text files for crawlers and agents. Never fall back to the SPA:
    # a missing file must be a 404, not the home page HTML.
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    # The OpenAPI contract lives under /api
    location = /openapi.json {
        return 301 /api/openapi.json;
    }

    # Any other text/data file that doesn't exist is a 404 too
    location ~* \.(txt|json|xml)$ {
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:47652;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE settings
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
