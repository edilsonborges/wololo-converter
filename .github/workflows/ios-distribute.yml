name: iOS Distribution

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Provisioning profile distribution method
        type: choice
        options: [app-store-connect, ad-hoc]
        default: app-store-connect
      upload_testflight:
        description: Upload the exported build to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  distribute:
    name: Sign and export iOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      EXPORT_METHOD: ${{ inputs.destination }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, plistlib, subprocess
          required = ['IOS_TEAM_ID', 'IOS_CERTIFICATE_BASE64', 'IOS_CERTIFICATE_PASSWORD',
                      'IOS_APP_PROFILE_BASE64', 'IOS_SHARE_PROFILE_BASE64']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure the signing secrets and variables first: ' + ', '.join(missing))
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          certificate = temporary / 'wololo.p12'
          certificate.write_bytes(base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64'], validate=True))
          certificate.chmod(0o600)
          profiles = pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          profiles.mkdir(parents=True, exist_ok=True)
          identifiers = {}
          for kind, bundle in [('APP', 'dev.edilson.wololo'), ('SHARE', 'dev.edilson.wololo.share')]:
              raw = base64.b64decode(os.environ[f'IOS_{kind}_PROFILE_BASE64'], validate=True)
              source = temporary / f'{kind}.mobileprovision'
              source.write_bytes(raw)
              profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(source)]))
              if os.environ['IOS_TEAM_ID'] not in profile['TeamIdentifier']:
                  raise SystemExit(f'{kind} profile belongs to another team')
              if not profile['Entitlements']['application-identifier'].endswith('.' + bundle):
                  raise SystemExit(f'{kind} profile does not match {bundle}')
              uuid = profile['UUID']
              (profiles / f'{uuid}.mobileprovision').write_bytes(raw)
              identifiers[bundle] = uuid
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write(f'WOLOLO_{kind}_PROFILE={uuid}\n')
          options = {'method': os.environ['EXPORT_METHOD'], 'teamID': os.environ['IOS_TEAM_ID'],
                     'signingStyle': 'manual', 'signingCertificate': 'Apple Distribution',
                     'provisioningProfiles': identifiers, 'manageAppVersionAndBuildNumber': False}
          (temporary / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          signing_keychain="$RUNNER_TEMP/wololo-signing.keychain-db"
          signing_password="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_password"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/wololo.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$signing_keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
      - name: Archive
        run: |
          build_number=$((100 + GITHUB_RUN_NUMBER))
          xcodebuild -project mobile/ios/Wololo.xcodeproj -scheme Wololo \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Wololo.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            WOLOLO_APP_PROFILE="$WOLOLO_APP_PROFILE" \
            WOLOLO_SHARE_PROFILE="$WOLOLO_SHARE_PROFILE" \
            CURRENT_PROJECT_VERSION="$build_number" archive
      - name: Export IPA
        run: >-
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Wololo.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          -exportPath "$RUNNER_TEMP/export"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wololo-ios-${{ inputs.destination }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
      - name: Send to TestFlight
        if: inputs.upload_testflight && inputs.destination == 'app-store-connect'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names = ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_PRIVATE_KEY_BASE64']
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('Configure ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY_BASE64')
          folder = pathlib.Path.home() / '.appstoreconnect/private_keys'
          folder.mkdir(parents=True, exist_ok=True)
          key = folder / ('AuthKey_' + os.environ['ASC_KEY_ID'] + '.p8')
          key.write_bytes(base64.b64decode(os.environ['ASC_PRIVATE_KEY_BASE64'], validate=True))
          key.chmod(0o600)
          PY
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/Wololo.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/wololo-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/wololo.p12" "$RUNNER_TEMP/APP.mobileprovision" "$RUNNER_TEMP/SHARE.mobileprovision"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${WOLOLO_APP_PROFILE:-missing}.mobileprovision"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${WOLOLO_SHARE_PROFILE:-missing}.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys"
